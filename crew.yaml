global_guardrails:
- No GATE_OUT_RELEASED sin documentos fiscales aplicables, sellos conformes y liberaciones aduaneras/documentales requeridas.
- No ajustes, write-offs, compensaciones de saldo ni destrucción física sin investigación y autoridad competente.
- No movimientos físicos sin transacción RF ni mezcla de lotes, caducidades o estados de calidad incompatibles.
- No conteo ciego con saldo teórico revelado ni cierre de varianza sin el reconteo independiente requerido.
- No clasificación arancelaria para pagar menos sin sustento técnico-legal ni despacho sin RRNAs/NOMs aplicables.
- No alteración de logs, XML, acuses, evidencias o estados para cumplir KPIs.
- N0 no sustituye validaciones físicas, técnicas, contables, fiscales o legales de los roles especializados.
escalation:
  default_chain:
  - N5
  - N4
  - N3
  - N2
  - N1
  - N0
  resolution: Usar reports_to real de cada agente; la cadena indica precedencia, no salto automático de niveles.
  triggers:
  - hard_block
  - authority_threshold_exceeded
  - sla_breach
  - evidence_conflict
  - cross_domain_deadlock
  - safety_or_legal_emergency
  payload_required:
  - correlation_id
  - event_summary
  - actions_taken
  - current_blockers
  - impact
  - threshold_breached
  - decision_requested
  - evidence_refs
  deadlock_policy: Tras max_reassignments_per_event, detener reasignaciones y escalar a N0; no usar re-ruteo para eludir bloqueos.
