# Manifiesto declarativo de orquestación para CrewAI / lolo-code.
# Las referencias skill_file son relativas a la raíz logistics-crew-skills.
# Los handoffs explícitos no modifican la autoridad definida en cada ficha.
schema_version: '1.0'
metadata:
  name: logistics-crew-skills
  version: 2.0.0
  language: es
  purpose: Orquestación jerárquica de 29 puestos logísticos y un router N0.
  target_runtimes:
  - CrewAI
  - lolo-code
  manifest_type: declarative_portable
  notes: El adaptador del runtime debe resolver agents, skill_file y los contratos de handoff; este archivo no ejecuta herramientas
    ni sustituye credenciales.
crew:
  name: logistics-crew
  process: hierarchical
  manager_agent: log-n0-supply-chain-router
  agents_source: agents
  entrypoint: log-n0-supply-chain-router
  language: es
  max_reassignments_per_event: 3
  human_escalation_required_for:
  - legal_hold
  - financial_writeoff_above_N1
  - safety_emergency
  - unresolved_cross_domain_conflict
skill_resolution:
  root: .
  path_field: skill_file
  load_policy: on_demand
  hash_algorithm: sha256
  required_sections:
  - ID y Jerarquía
  - Gatillo
  - Inputs
  - Árbol de Decisión
  - Prohibiciones Duras
  - Entregable de Salida
  - KPIs
agents:
- id: log-n0-supply-chain-router
  role: Director de Supply Chain / Orquestador General
  goal: Orquesta el Crew Logístico Jerárquico de Almacén/CEDIS, Transporte/Patio, Aduanas/Comercio Exterior e Inventarios/Slotting;
    clasifica eventos, selecciona al agente responsable, controla handoffs, bloqueos y escalamientos N5→N1/N0.
  backstory: Agente N0 de 00-orchestrator. Opera exclusivamente dentro de las competencias, evidencias y guardrails definidos
    en su ficha técnica.
  branch: 00-orchestrator
