communication:
  topology: hierarchical_with_explicit_cross_domain_handoffs
  default_protocol: synchronous_request_response
  event_protocol: asynchronous_correlated_handoff
  rules:
  - Las instrucciones descendentes siguen reports_to/manages; N0 coordina y no ejecuta tareas técnicas reservadas.
  - Toda comunicación lateral debe figurar en delivers_handoff_to y receives_handoff_from; la lista no otorga autoridad adicional.
  - Un bloqueo duro se propaga inmediatamente al supervisor competente aunque el flujo comercial esté en curso.
  - El receptor debe aceptar o rechazar el handoff con motivo estructurado; el silencio nunca equivale a aceptación.
  - Un mismo correlation_id agrupa todas las subtareas; un objeto físico o documental solo tiene un agente dueño por vez.
  - Ninguna comunicación puede ordenar violar los global_guardrails ni los guardrails de la skill receptora.
  message_envelope:
    required:
    - message_id
    - correlation_id
    - event_type
    - timestamp
    - sender_agent
    - recipient_agent
    - object_ref
    - current_state
    - requested_action
    - required_authority
    - sla_due_at
    - blocking_states
    - evidence_refs
    optional:
    - impact_mxn
    - impact_usd
    - customer_sla_risk
    - parent_message_id
    - retry_count
    - notes
    completion_requires:
    - output_state
    - deliverable_ref
    - evidence_refs
    - receiver_ack
  handoff_states:
  - HANDOFF_REQUESTED
  - HANDOFF_ACCEPTED
  - HANDOFF_REJECTED
  - IN_PROGRESS
  - HARD_BLOCK_ACTIVE
  - ESCALATION_ISSUED
  - OUTPUT_CONFIRMED
  - HANDOFF_CLOSED
  rejection_codes:
  - HANDOFF_INCOMPLETE
  - INSUFFICIENT_AUTHORITY
  - EVIDENCE_MISSING
  - OBJECT_BLOCKED
  - INVALID_STATE
  - SLA_EXPIRED
