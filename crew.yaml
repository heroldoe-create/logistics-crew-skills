  CrewAI:
    process: hierarchical
    manager_agent: log-n0-supply-chain-router
    agent_definitions: agents
    delegation_field: allow_delegation
  lolo-code:
    entrypoint: log-n0-supply-chain-router
    skills_root: .
    skill_reference_field: skill_file
    handoff_contract: communication.message_envelope
